services:
  - type: web
    name: wayang-c4isr
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_wayang.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: WAYANG_ADMIN_TOKEN
        generateValue: true
